<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wataru Takamine - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --border: #333333;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #0a0a0a;
            --text-secondary: #666666;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.05;
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 24px;
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            color: var(--accent);
            transform: rotate(180deg);
        }

        .profile {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 42px;
            font-family: 'JetBrains Mono', monospace;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .name-kanji {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .info-section {
            margin-bottom: 35px;
            position: relative;
            z-index: 1;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 15px;
            gap: 10px;
        }

        .info-icon {
            width: 20px;
            height: 20px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .company-link {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
            position: relative;
        }

        .company-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        .company-link:hover::after {
            width: 100%;
        }

        .company-link:hover {
            color: var(--accent-hover);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            z-index: 1;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background-color: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .social-link:hover::before {
            width: 100%;
            height: 100%;
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .name-kanji {
                font-size: 18px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 32px;
            }

            .info-item {
                flex-direction: row;
                align-items: center;
            }
        }

        /* アニメーション */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .profile { animation-delay: 0.1s; }
        .info-section { animation-delay: 0.3s; }
        .social-links { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="テーマ切り替え">
            <span id="theme-icon">🌙</span>
        </button>

        <div class="profile fade-in">
            <div class="avatar">WT</div>
            <h1>Wataru Takamine</h1>
            <p class="name-kanji">高峰 航</p>
            <p class="tagline">
                Software Engineer ・ Coffee Lover ・ Medical Doctor
            </p>
        </div>

        <div class="info-section fade-in">
            <div class="info-item">
                <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 21V11l9-7 9 7v10a1 1 0 01-1 1h-6a1 1 0 01-1-1v-7h-2v7a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>
                </svg>
                <span>Works for <a href="https://txpmedical.jp/" target="_blank" rel="noopener noreferrer" class="company-link">TXP Medical Inc.</a></span>
            </div>
            <div class="info-item">
                <svg class="info-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span>Tokyo, Japan</span>
            </div>
        </div>

        <div class="social-links fade-in">
            <a href="https://x.com/w_tkmn" target="_blank" rel="noopener noreferrer" class="social-link" title="X (Twitter)">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
            <a href="https://tkmn.notion.site/" target="_blank" rel="noopener noreferrer" class="social-link" title="Notion">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632z"/>
                </svg>
            </a>
            <a href="https://github.com/wtkmn" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor">

                </svg>
            </a>
        </div>
    </div>

    <script>
        // テーマ切り替え機能
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            const icon = document.getElementById('theme-icon');
            
            html.setAttribute('data-theme', newTheme);
            icon.textContent = newTheme === 'light' ? '☀️' : '🌙';
            
            // テーマ設定を保存
            localStorage.setItem('theme', newTheme);
        }

        // 初期テーマ設定
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const icon = document.getElementById('theme-icon');
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            icon.textContent = savedTheme === 'light' ? '☀️' : '🌙';

            // フェードインアニメーションをトリガー
            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach(el => el.classList.add('fade-in'));
        });
    </script>
</body>
</html>
